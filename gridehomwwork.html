<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    body{
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 50px;
        
        
    }
   .main{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    grid-template-areas:
    "header header header"
    "hero mainC mainC"
    "sidebar mainC mainC"
    "extra extra extra"
    "related related extraPost"
    "footer footer footer";
    width: 50%;
    height: 80vh;

    grid-template-rows: 60px   100px  250px  1fr   120px 120px  60px;  
   }
   .header{
    background-color: rgb(133, 179, 248);
        grid-area: header;
    
   }
    .hero{
     background-color: rgb(248, 133, 133);
        grid-area: hero;
    
    }
    .mainC{
        background-color: rgb(248, 133, 248);
        grid-area: mainC;
        
    }
    .sid{
        background-color: rgb(133, 248, 133);
        grid-area: sidebar;
        
    }
    .extra{
        background-color: rgb(248, 248, 133);
        grid-area: extra;
    }
    .related{
        background-color: rgb(133, 248, 248);
        grid-area: related;
    }
    .relatedPost{
        background-color: rgb(248, 133, 248);
        grid-area: extraPost;
    }
    .footer{
        background-color: rgb(248, 133, 133);
        grid-area: footer;
    }

   
</style>
<body>
    <div class="main">
        <div class="header">Header</div>
        <div class="hero">hero</div>
        <div class="mainC">Main Content</div>
        <div class="sid">Sidebar</div>
        <div class="extra">Extra Content</div>
        <div class="related">related images</div>
        <div class="relatedPost">related post</div>
        <div class="footer">Footer</div>


    </div>
</body>
</html>
