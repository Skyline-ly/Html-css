<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        text-align: center;
        
        
    
    
    }
    .section{
       display: grid;
        grid-template-rows:60px 3fr;
        background-color: rgb(230, 13, 67);

        padding: 10px;
        gap: 10px;
        width: 60%;
        height: 70vh;
    }
    .item0{
        background-color: rgb(248, 133, 133);
        text-align: center;
       

    }
    .footer{
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 10px;
    }
    .left{
        background-color: rgb(133, 248, 133);

         align-items: center;
    }
    .right{
        display: grid;
        grid-template-rows: 2fr 1fr;
        gap: 10px;
    }
   .top{
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
    }
    .item1{
        background-color: rgb(248, 133, 248);
        text-align: center;
    }
    .item2{
        background-color: rgb(248, 248, 133);
        text-align: center;
    }
    .buttom{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .item3{
        background-color: rgb(133, 248, 248);
        text-align: center;
    }
    .item4{
        background-color: rgb(248, 133, 133);
        text-align: center;
    }
</style>
<body>
    <div class="section">   
        <div class="item0"></div>

        <div class="footer">
            

            <div class="left"></div>


            <div class="right">

                <div class="top">
                     <div class="item1"></div>
                  <div class="item2"></div>
                </div>
                 
        
                  <div class="buttom">
                    <div class="item3"></div>
                    <div class="item4"></div>
                  </div>
            </div>
            
            
            ~
          
        </div>
    </div>
</body>
</html>
